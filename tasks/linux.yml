- name: Ensure system is prepared for Exegol installation
  block:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - python3
          - python3-pip
          - python3-venv
          - pipx
          - python3-argcomplete
        state: present
        update_cache: yes
      become: true

    - name: Validate Exegol image selection
      ansible.builtin.assert:
        that:
          - image_to_install | default('') in ['full', 'ad', 'web', 'light', 'osint', 'nightly']
        fail_msg: "Invalid Exegol image. Choose from: full, ad, web, light, osint, nightly"
      when: image_to_install is defined

- name: Install Docker
  block:
    - name: Download and execute Docker installation script
      ansible.builtin.shell: 
        cmd: curl -fsSL https://get.docker.com/ | sh
        creates: /usr/bin/docker
      become: true

    - name: Add user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      become: true

    - name: Ensure Docker service is started
      ansible.builtin.systemd:
        name: docker
        enabled: yes
        state: started
      become: true

- name: Configure Exegol Installation
  block:
    - name: Determine user's home directory
      ansible.builtin.command: "echo ~{{ ansible_user }}"
      register: user_home
      changed_when: false

    - name: Install Exegol via pipx
      ansible.builtin.shell: 
        cmd: "pipx install exegol"
        creates: "{{ user_home.stdout }}/.local/bin/exegol"
      become: true
      become_user: "{{ ansible_user }}"

    - name: Ensure pipx path is configured
      ansible.builtin.shell: 
        cmd: "pipx ensurepath"
      become: true
      become_user: "{{ ansible_user }}"

    - name: Configure Exegol sudo alias
      ansible.builtin.lineinfile:
        path: "{{ user_home.stdout }}/.bash_aliases"
        line: "alias exegol='sudo -E $(which exegol)'"
        create: yes
      become: true
      become_user: "{{ ansible_user }}"

    - name: Configure Exegol auto-completion
      ansible.builtin.shell: 
        cmd: "register-python-argcomplete --no-defaults exegol | sudo tee /etc/bash_completion.d/exegol > /dev/null"
      become: true
      args:
        creates: /etc/bash_completion.d/exegol

- name: Install Exegol Image
  block:
    - name: Install Exegol image using pipx run
      ansible.builtin.shell: 
        cmd: "yes | pipx run exegol install {{ image_to_install }}"
      become: true
      become_user: "{{ ansible_user }}"
      when: 
        - image_to_install is defined
        - image_to_install | length > 0

    - name: Verify Exegol installation
      ansible.builtin.command: "pipx run exegol version"
      register: exegol_version
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ ansible_user }}"
