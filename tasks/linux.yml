---
- name: Install prerequisites
  apt:
    name:
      - curl
      - git
      - python3
      - python3-pip
      - python3-venv
      - pipx
      - python3-argcomplete
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Install Docker
  block:
    - name: Create keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.gpg
        mode: '0644'

    - name: Install Docker GPG key
      shell: gpg --dearmor < /tmp/docker.gpg > /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permissions on Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Create docker group if it doesn't exist
      group:
        name: docker
        state: present

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Enable and start Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

- name: Install Exegol
  block:
    - name: Get user home directory
      shell: echo ~{{ ansible_user }}
      register: user_home
      changed_when: false
      become: false

    - name: Install Exegol via pipx
      shell: pipx install exegol
      args:
        creates: "{{ user_home.stdout }}/.local/bin/exegol"
      become_user: "{{ ansible_user }}"
      become: true

    - name: Add Exegol to PATH
      shell: pipx ensurepath
      become_user: "{{ ansible_user }}"
      become: true

    - name: Set up Exegol auto-completion
      shell: register-python-argcomplete --no-defaults exegol > /etc/bash_completion.d/exegol
      args:
        creates: /etc/bash_completion.d/exegol

- name: Install Exegol image
  block:
    - name: Ensure pexpect is present
      ansible.builtin.apt:
        name: python3-pexpect
        state: present

    - name: Install Exegol (free)
      ansible.builtin.expect:
        command: /home/debian/.local/bin/exegol install free
        responses:
          "accepted the EULA": "Y"
          "display EULA here": "N"
          "activate your Exegol subscription": "N"
          "not \\*that\\* kind of person": "Y"
        timeout: 600
      become: true
